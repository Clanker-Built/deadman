# Compose stack for Postgres + 2× MinIO.
#
# All ports bind to 127.0.0.1 only. The control plane talks to these over
# loopback; nothing here should be reachable from the LAN, let alone the
# internet. If you need to administer MinIO directly, SSH-tunnel the
# console port (9001/9011) — do not edit these to 0.0.0.0.
#
# Credentials come from a sibling `.env` file written by
# scripts/setup-onion.sh. Defaults are kept here only for `make dev-run`
# convenience; real installs override them.

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deadman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deadman}
      POSTGRES_DB: ${POSTGRES_DB:-deadman}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deadman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deadman} -d ${POSTGRES_DB:-deadman}"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deadman}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deadmandeadman}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - deadman_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Secondary S3-compatible backend. Same image; different volume so the
  # "second cloud" simulation actually exercises the multi-cloud paths.
  minio_backup:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deadman}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deadmandeadman}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - deadman_minio_backup:/data

volumes:
  deadman_pg:
  deadman_minio:
  deadman_minio_backup:
