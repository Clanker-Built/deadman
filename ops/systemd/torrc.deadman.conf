# /etc/tor/torrc.d/deadman.conf  —  Tor v3 hidden service for Deadman.
# Installed by scripts/setup-onion.sh. Do NOT delete /var/lib/tor/deadman/
# or you will permanently lose the .onion address.

HiddenServiceDir /var/lib/tor/deadman/
HiddenServiceVersion 3
HiddenServicePort 80 127.0.0.1:8080

# Optional hardening: limit the hidden service to a single circuit at a
# time during low-load periods to reduce traffic-analysis surface. Comment
# out if it interferes with regular use.
# HiddenServiceNumIntroductionPoints 3
