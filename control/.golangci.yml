run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - nilerr
    - wastedassign

linters-settings:
  gosec:
    excludes:
      - G104  # too noisy pre-M1
  revive:
    rules:
      - name: var-naming
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
