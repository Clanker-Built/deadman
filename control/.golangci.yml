version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # default: none makes this list the complete, authoritative linter policy —
  # removing a line here really disables that linter.
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    errcheck:
      # Read-side Close policy, settled once: errors from closing read streams
      # carry nothing actionable. Write-side closes must still be checked.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*net/smtp.Client).Close
    # gosec suppressions live as per-site `#nosec Gxxx -- reason` annotations,
    # honored identically by this bundled gosec and the pinned standalone
    # gosec CI job. The one rule-level exclude below is for a mitigation that
    # is central rather than per-site, so a site annotation would be noise at
    # every current and future form handler.
    gosec:
      excludes:
        # Request bodies ARE bounded, just not at the ParseForm sites the rule
        # inspects: csrfMiddleware caps every /ui/ mutating request at
        # maxUIFormBytes before any handler parses, and the /api bundle upload
        # applies its own MaxBytesReader (internal/httpapi/bundle_routes.go).
        - G120
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
