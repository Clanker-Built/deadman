name: control-ci

on:
  push:
    branches: [main]
    paths:
      - 'control/**'
      - '.github/workflows/control-ci.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'control/**'
      - '.github/workflows/control-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: control

  # Standalone pinned gosec run. Rule coverage differs between this CLI and
  # the gosec bundled in golangci-lint (each fires rules the other doesn't),
  # so both run. Suppressions live as per-site `#nosec Gxxx -- reason`
  # annotations in the code, honored identically by both runners.
  gosec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...
